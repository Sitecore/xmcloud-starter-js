externalImageRenderingVerdict:
  checkedAt: "2026-08-31T19:20:00Z"
  siteName: "amkor"
  component: "ArticleContent"
  variant: "WithImage {AA41D913-0CFD-44C6-92E7-52C3D1D99599}"
  rendering: "{B1136CF1-94BE-468C-B78D-9BE212AF5428}"
  verdict: >
    Experience Edge returns image {value:{}} in the layout response for page (route) Image fields
    whose value is external-URL XML, and the raw XML string is NOT present anywhere in the layout
    payload. Client-side hydration therefore had nothing to work with: hydrateExternalImageField
    was correctly wired into the WithImage path but could never recover a src. Claim B (no image
    rendered) was right about the symptom; Claim A was wrong about the cause (the raw value is not
    returned for route fields). Migration to DAM was NOT required.
  evidence:
    - "Sitecore /Home/Packaging image = <image src=\"https://images.unsplash.com/photo-1760842543713-...?w=1200&amp;q=80\" alt=\"...\" />"
    - "Pre-fix RSC payload at http://localhost:3000/Packaging?site=amkor contained \"image\":{\"value\":{}}"
    - "Pre-fix served HTML had data-variant=\"WithImage\" but no external <img>"
    - "Control /About-Us/News/Blog/Amkor-2029 (Sitecore DAM image) rendered before and after"
  fix:
    - "src/lib/route-image-from-edge.ts - fetchRouteImageXml / applyExternalRouteImage use the Content API field(name:\"image\"){value} resolver (same workaround as location-footprint-from-edge and the NewsListing ComponentQuery) to recover the raw XML"
    - "src/app/[site]/[locale]/[[...path]]/page.tsx - awaits applyExternalRouteImage(page, locale); additive only, no-op when the field is already populated or the lookup fails"
    - "src/lib/sitecore-image-field.ts - decodeXmlEntities applied to src/alt attribute extraction so &amp; in query strings resolves correctly"
  verification:
    localDev: >
      Verified rendered <img> with the expected external URL on /Packaging, /Quality, /Technology,
      /Test-Services, /Applications/Automotive (Unsplash) and on six blog detail pages using
      amkormarcomexternal.blob.core.windows.net. DAM control unchanged.
    tests: "npx jest src/__tests__/article-content - 28 passed, 1 pre-existing kmpage failure (unchanged)"
    lint: "npm run lint - 0 errors, 12 pre-existing warnings"
    editingHost: "NOT verified - the deployed Default editing host runs an older build and needs a redeploy before Sitecore Pages shows these images"
  pendingManual:
    - "Redeploy the Default editing host so Sitecore Pages picks up the route-image fix"
    - "Publish amkor content to Edge so published delivery reflects the backfilled image values"
  blogListingCardImages:
    checkedAt: "2026-08-31T20:45:00Z"
    siteName: "amkor"
    component: "BlogListing"
    variant: "Cards"
    rendering: "{8278F36C-8492-4641-A401-9C19AA69D08A}"
    datasource: "{BCA09BD3-B05F-4916-B1BD-EB9D4C5FB29C}"
    verdict: >
      Distinct from the route-image bug: the src attribute IS emitted and the Azure blob URLs are
      valid. Failure is confined to the Next.js image optimizer path. next.config.ts sets
      unoptimized only when NODE_ENV=development, so local dev emits direct blob URLs and works,
      while the production editing host routes every card image through /_next/image via the custom
      loader. shouldBypassOptimizer did not cover the blob host and BlogListing hard-coded
      unoptimized only for images.unsplash.com, so blob cards went through the optimizer and broke
      in Pages. The one working card (Amkor 2029) uses a sitecoresandbox.cloud DAM URL, which
      shouldBypassOptimizer already exempts. Content values are correct and were not changed.
    evidence:
      - "All 10 emitted card srcs are direct https://amkormarcomexternal.blob.core.windows.net/... URLs on local dev (0 /_next/image wrappers)"
      - "curl of each of the 10 URLs returned HTTP 200 with image/png or image/jpeg"
      - "next.config.ts images.unoptimized = process.env.NODE_ENV === 'development'; loader custom -> src/lib/sitecore-image-loader.ts"
      - "Local /_next/image returns 404 in dev because optimization is disabled there, so the production optimizer response could not be reproduced locally"
    fix:
      - "src/lib/sitecore-image-loader.ts - added isExternalDemoMediaHost (*.blob.core.windows.net) to shouldBypassOptimizer"
