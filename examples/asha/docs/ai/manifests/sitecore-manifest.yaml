    notes:
      - "2026-10-06: Version4 for the BCAA header. Single fixed row, light logo plate, centered L1, login/search/hamburger icons. Transparent at the top of the page, bg-primary after 12px of scroll, slides away after 180px of downward scroll, returns on scroll up. Created bcaa Headless Variants/HeaderST {69CD41AA-547A-414B-BBFF-ADC5F778D4F2}, Default {B9FEDA61-BC77-4054-AD6E-FA8C65C9BAFE}, Version4 {8EFB1919-BAB1-4883-99F7-321AF3D97188}. Default layout unchanged. No new datasource fields or rendering params. FieldNames cannot be set via MCP."
      - "2026-09-09: Version3 Spanish flag hrefs use Sitecore Colombia language es-CO (/es-CO/{path}), not es-ES. Added COLOMBIAN_SPANISH_LOCALE to src/lib/locale.ts SUPPORTED_LOCALES so next-intl / LocaleProxy / app-locale cookie treat /es-CO like other non-default locales. Atlanta Apparel Version2 keeps SPANISH_LOCALE es-ES. Default/LoginRequired/Version1/Version2 UI unchanged; no new Sitecore items."
      - "2026-09-09: Version3 EN/ES flag language switcher for the LCMC demo. US flag → English, Spain flag → Español. Placement: right cluster immediately left of search (does not wrap primary nav). Reuses existing useLanguageSwitcher + buildLanguageSwitchPathname; Sitecore Spanish language name is es-CO (Colombia), so hrefs are /en/… and /es-CO/…. No new Sitecore items, variants, or rendering params. Default/LoginRequired/Version1/Version2 unchanged."
      - "2026-09-04: Atlanta Apparel HeaderST Version2 language dropdown (top-right of the dark utility row). Confirmed on Header partial {506BF874-2F4C-4415-8A7B-A17014A1E65C} FieldNames={F0F3B5E5-DA94-4B53-A6BD-143F3F9B5538} (Version2). Dropdown is gated to atlanta-apparel via page.siteName / context.site.name / ?site= so americasmart Version2 is unchanged. Languages: English (en), Japanese (ja-JP), Spanish (es-ES) — Sitecore tenant language names; prefers layout context.languages when that list includes en+ja+es, else this fallback. Href pattern matches Version1: /{locale}{path}?{query} via buildLanguageSwitchPathname. Added SPANISH_LOCALE to src/lib/locale.ts SUPPORTED_LOCALES so next-intl / LocaleProxy / app-locale cookie treat /es-ES the same as /ja-JP. No new Sitecore items, variants, or rendering params. Default/LoginRequired/Version1/Version3 unchanged."
      - "2026-09-03: Version2 lg-band (1024-1279px) crowding fix for atlanta-apparel Pages laptop breakpoint. Logo was lg:h-12/320px and centered nav collided with Exhibitor Directory. Cap logo at lg:h-9/168px (xl restores h-12/280px), main-row lg:gap-3, primary nav flex-nowrap justify-end overflow-visible, compact a/span/button padding, force li w-auto so Sitecore col-12 cannot stretch under the logo. City triggers slightly tighter until xl. Code-only; no new Sitecore variants or RP fields. Default/LoginRequired/Version1/Version3 unchanged."
      - "2026-09-03: Version2 now renders live-matching ANDMORE city pull-downs (ATLANTA, LAS VEGAS, HIGH POINT, NEW YORK) plus Market Plan on the dark utility row. Code-only menus in HeaderST.tsx (version2LocationMenus) because HeaderST's shared datasource has no location fields and the skill forbids new cosmetic datasource fields. Accessible button+menu (hover or click, Escape/outside close). Atlanta Apparel (/) is internal; sister markets are live ANDMORE URLs. Market Plan → /visit/plan-your-market {94A9563C-55F2-4348-BFAF-95D95DDD58A6}. atlanta-apparel Header datasource LoginLink set to Sign In → https://www.atlanta-apparel.com/login. Default/LoginRequired/Version1/Version3 layouts unchanged. No new Sitecore variants or RP fields."
      - "2026-08-31: Version1 language selector is now functional. English/Korean/Japanese/Simplified Chinese link to locale-prefixed URLs for the CURRENT page (/en/..., /ko-KR/..., /ja-JP/..., /zh-CN/...) instead of the old external amkor.com/kr|/jp|/cn hrefs, and the active language is highlighted via aria-current + --color-header-lang-active. Locale codes are the Sitecore language names (ja-JP, ko-KR, zh-CN). Shared plumbing: src/lib/locale.ts (new), routing.locales extended from [en] to [en, ja-JP, ko-KR, zh-CN], proxy.ts remembers the chosen language in an app-locale cookie and replays it on Sitecore's unprefixed links, and the catch-all page falls back to the default language when a page has no version in the requested language. amkor Home + children have real ja-JP content; ko-KR and zh-CN have no versions and therefore render the English fallback. No Sitecore items created or changed (amkor Version1 variant {3C5FBC3A-F12E-4EAF-A2B2-17DF9BEECE5A} already existed). Default/LoginRequired/Version2/Version3 unchanged."
      - "2026-08-29: Version1 cascade megamenu (MegaMenuCascade.tsx). MENU opens dark overlay; L1 column ? L2 ? L3 (Careers countries split). MegaMenuItem Default + LinkList HeaderPrimaryLinks/HeaderSecondaryLinks register into cascade when MegaMenuCascadeProvider wraps header-navigation (Version1 only). MobileMenuWrapper exports useMobileMenu + darkPanel. Default/Version2/Version3 unchanged."
      - "2026-08-29: Version1 cascade fix � darkPanel uses sr-only (not opacity-0 fixed overlay) when closed; L1 registration runs in Pages editing mode; utility/main rows z-[60] keep logo + lang row above overlay; partial-editing-mode still expands sr-only slot for Header PD authoring."
      - "2026-08-26: Version1 pixel-perfect to amkor.com. Two-tone Amkor tokens (--color-header-utility #4E4E4E top, --color-header-background #1E1E1E main, --color-header-menu #111 MENU box, --color-header-muted SEARCH...). Version1-hardcoded langs (English current / ??? / ??? / ???? ? amkor.com/kr|/jp|/cn) and six utility links (Document Library, Factory Certs, Investors, Cloud Services, Careers, Contact Us) � no new datasource fields. SupportLink skipped when it duplicates a utility label. HideCart still honored. Logo mix-blend lighten on [data-theme=amkor] Version1 to drop a baked-in black plate; authors should still upload Amkor-white.svg. Default/Version2/Version3 unchanged. Code-only."
      - "2026-08-25: Version3 L1 clip was CSS, not missing Sitecore items. MCP get_components_on_page on LCMC Header {7D1AB59C-D03F-420A-AE9B-D97F511CF28E} confirmed 5 MegaMenuItem renderings in header-navigation-1 (Speakers/Headphones/Amps/Pro/Artist Services). shrink-0 + nowrap + ml-auto + min-w-0 parent overflowed LEFT under the logo (relative z-10); compact padding only targeted a, while MegaMenuToggle uses span.p-4. Fix: nav column flex-1, drop shrink-0/ml-auto, overflow-visible, compact a/span/button, force li w-auto/basis-auto. Did not use overflow-x-auto (would trap lg:absolute mega menus). Default/Version1/Version2 unchanged. HeaderST.test.tsx Version3 nowrap + not overflow-hidden."
      - "2026-08-25: Version3 primary nav no longer uses flex-wrap/min-w-0. Those classes let the ul shrink until each MegaMenuItem sat on its own line. Primary ul is now flex-nowrap shrink-0; utility row may still wrap. Logo/gap/search min-width lg tuning kept so the row cannot slide under the logo at 1024px. Partial-editing-mode !flex-col is unchanged."
      - "2026-08-25: Version3 responsive fix for the lg band (1024-1279px), where the placeholder nav overflowed left and rendered underneath the logo. Logo capped at lg:h-11/190px, container gap lg:gap-3, nav links compacted to px-2/13px via [&>li>a], utility links to 11px, both nav rows flex-wrap, and the contained search pill min-width lowered to 10rem (touches SearchBox.tsx + HeaderPreviewSearch.tsx contained appearance, which is Version3-only). Full sizing restored at xl. Code-only; no Sitecore items touched."
      - "2026-08-25: Version3 utility row now renders LCMC's five live links (Notice of Non-Discrimination, Careers, Patient Portal/Pay my Bill, For Providers, Contact Us) from the version3UtilityLinks constant in HeaderST.tsx. Code-only change � no Sitecore items touched, and Default/Version1/Version2 are unaffected. HeaderST's datasource exposes a single SupportLink and the template is shared across sites, so the list is demo-fixed rather than authorable; SupportLink still renders after the five unless its text duplicates one of them. Careers targets https://careers.lcmchealth.org/us/en/ in a new tab; the other four target existing lcmc demo pages (/notice-of-non-discrimination, /for-patients/patient-portal, /for-providers, /contact-us). HeaderST.test.tsx 58 tests passed."
      - "2026-08-24: Version3 LCMC-style header (single white bar, logo left, stacked utility+primary nav, muted rounded search bar). Headless variants on pkm, site-base, and lcmc. No new RP fields."
      - "2026-08-24: Version2 Andmore-style header (dark utility row, logo left, inline nav, search icon). Headless variants on amkor, americasmart, atlanta-apparel, and site-base."
