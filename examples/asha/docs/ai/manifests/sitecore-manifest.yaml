        old source.unsplash.com redirect service is discontinued. Photos were therefore scraped from the rendered
        search results in a headed Playwright Chromium session. UNSPLASH_ACCESS_KEY was checked for and is not set
        in this environment; the script prefers the official api.unsplash.com endpoint when it is present.
