      encodingNotes: >
        s:par is a URL-encoded query string; the whole attribute value is then XML-attribute-encoded.
        So the `&` separator is written as `&amp;` and the GUID braces as %7b / %7d. The pre-existing
        DynamicPlaceholderId=1 parameter was preserved on every page � nothing was clobbered.
        GridParameters, Styles, RenderingIdentifier and CSSStyles were null before and remain null.
