  - name: "amkor-article-content-image-variants"
    kind: "variants"
    category: "Page Content"
    status: "complete"
    createdAt: "2026-08-31T18:05:00Z"
    updatedAt: "2026-08-31T18:05:00Z"
    siteName: "amkor"
    siteCollection: "amkor"
    component: "ArticleContent"
    renderingId: "{B1136CF1-94BE-468C-B78D-9BE212AF5428}"
    rootCause: >
      Two independent defects made the populated page `image` field invisible in the Pages canvas.
      (1) The `Default` export of src/components/article-content/ArticleContent.tsx never rendered an
      image at all � it destructured only text fields from mergeArticleContentFields and had no image
      JSX; only the `kmpage` variant rendered one. amkor's 114 pages carry ArticleContent with no
      FieldNames parameter, so they render `Default`. (2) pickResolvedImage in
      src/components/article-content/article-content.fields.ts gated image resolution on
      `field.value?.src`, which is always empty for external-URL Image XML. amkor pages store
      `image` as `<image src="https://amkormarcomexternal.blob.core.windows.net/..." alt="..." />`
      (verified on /Home/About Us and 10 siblings), and Sitecore Edge returns an empty jsonValue for
      that shape, so the field was dropped before any variant could render it. Field name casing was
      NOT the cause � IMAGE_ALIASES already covers `image`, `Image`, `pageThumbnail`.
    codeChanges:
      - "src/lib/sitecore-image-field.ts: added extractImageAlt + hydrateExternalImageField, rebuilding an ImageField from raw external Image XML (same regex-attribute approach as NewsListing itemImage/attributeValue)"
      - "src/components/article-content/article-content.fields.ts: pickResolvedImage now hydrates the field and accepts it when extractImageSrc resolves a URL, instead of requiring value.src"
      - "src/components/article-content/ArticleContent.tsx: Default body extracted into internal ArticleContentLayout(showImage); new named exports WithImage (image between summary and body) and TextOnly (image suppressed). Default output unchanged � still copy-only"
    defaultBehaviourChanged: false
    blastRadius: >
      Rendering {B1136CF1-...} is shared across sites in this instance. progressive/pkm has its own
      ArticleContent Headless Variants container {5CAB3B17-8A72-46E7-A6E3-FBF6DA968DD7} with Default,
      ServicePageVariant and kmpage, and its Services Page / Knowledge Article pages also author an
      `image` field. Making `Default` render the image would therefore have added a large featured
      image to pkm (and any other site whose pages use Default with a populated image), so Default
      was deliberately left copy-only and an explicit WithImage variant was added instead. The
      pickResolvedImage fix does change pkm `kmpage` pages whose image is external XML: those images
      now appear, which is the documented intent of that variant.
