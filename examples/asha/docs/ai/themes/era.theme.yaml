# Client Brand Theme — ERA Everywhere
# Wired into the app via the create-new-theme skill (data-theme="era").
# Token CSS: src/assets/styles/themes/era.css

client:
  name: "ERA Everywhere"
  sourceUrl: "https://www.eraeverywhere.com/"
  extractedAt: "2026-08-11"
  extractedBy: "cursor"

colors:
  primary: "#e12616"
  primaryForeground: "#ffffff"
  secondary: "#f4f4f4"
  secondaryForeground: "#333333"
  accent: "#333333"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#454545"
  muted: "#f4f4f4"
  mutedForeground: "#6b6b6b"
  headerBackground: "#ffffff"
  headerForeground: "#333333"
  footerBackground: "#f4f4f4"
  footerForeground: "#454545"
  border: "#d4d4d4"
  ring: "#e12616"
  extra:
    - name: "primary-hover"
      value: "#c21f15"
    - name: "link"
      value: "#e12616"
    - name: "border-radius"
      value: "0"

typography:
  headingFamily: "Montserrat"
  headingWeight: "600"
  bodyFamily: "Inter"
  bodyWeight: "400"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@500;600;700&display=swap"
  headingTransform: "none"
  letterSpacing: "normal"
  notes:
    - "Live site uses Helvetica Neue for body and proprietary BlissMedium for headings."
    - "Substituted Inter (body) and Montserrat (headings) via next/font."

shape:
  borderRadius: "0"
  buttonRadius: "0"
  cardRadius: "0"
  shadowStyle: "none"
  borderStyle: "subtle"

tone:
  overall: "trade-ecommerce-corporate"
  colorMode: "light"
  contrast: "high"
  imagery: "product-photography"
  heroStyle: "banner-with-inset-copy-panel"
  cardStyle: "flat-bordered"
  navStyle: "utility-plus-search-plus-uppercase-nav"

extraction:
  confidence: "high"
  method: "playwright-full + user-screenshot"
  notes:
    - "Primary CTA and link color from computed styles: rgb(225, 38, 22) → #e12616."
    - "Body text rgb(69, 69, 69) → #454545."
    - "Secondary CTAs (VIEW PRODUCT / READ MORE) are charcoal #333333 (accent/dark)."
    - "BlissMedium is proprietary — Montserrat is the Google Fonts substitute for headings."
    - "Zero border-radius; primary buttons often uppercase."
