# Client Brand Theme
# Generated by the theme extraction skill from a client website.
# Place in: docs/ai/themes/<client-kebab>.theme.yaml

client:
  name: "Melaleuca"
  sourceUrl: "https://www.melaleuca.com/"
  extractedAt: "2026-10-14T21:40:00Z"
  extractedBy: "cursor"

colors:
  primary: "#30862d"
  primaryForeground: "#ffffff"
  secondary: "#eef5ee"
  secondaryForeground: "#145214"
  accent: "#21833b"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#111111"
  muted: "#f0f0f0"
  mutedForeground: "#4d4d4d"
  headerBackground: "#30862d"
  headerForeground: "#ffffff"
  footerBackground: "#12361a"
  footerForeground: "#ffffff"
  border: "#dddddd"
  ring: "#30862d"
  extra:
    - { name: "brandLime", value: "#eefe9c" }
    - { name: "buttonText", value: "#30862d" }

typography:
  headingFamily: "Roboto"
  headingWeight: "700"
  bodyFamily: "Roboto"
  bodyWeight: "400"
  monoFamily: ""
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
  scale:
    hero: "48px"
    h1: "48px"
    h2: "34px"
    h3: "24px"
    body: "16px"
    small: "12px"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "1.5"

spacing:
  density: "normal"
  sectionGap: ""
  containerMaxWidth: "1170px"
  containerPadding: ""

shape:
  borderRadius: "4px"
  buttonRadius: "4px"
  cardRadius: "0px"
  imageRadius: "0px"
  shadowStyle: "none"
  borderStyle: "1px solid #dddddd"

tone:
  overall: "wellness"
  colorMode: "light"
  contrast: "high"
  imagery: "photography"
  heroStyle: "full-bleed-image"
  cardStyle: "flat"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#30862d"
      secondary: "#eef5ee"
      accent: "#21833b"
  fontFamily:
    heading: ["Roboto", "sans-serif"]
    body: ["Roboto", "sans-serif"]
  borderRadius:
    DEFAULT: "0.25rem"
    button: "0.25rem"
    card: "0px"

cssVariables: |
  :root {
    --brand-primary: #30862d;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #eef5ee;
    --brand-secondary-foreground: #145214;
    --brand-accent: #21833b;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #111111;
    --brand-muted: #f0f0f0;
    --brand-muted-fg: #4d4d4d;
    --brand-header-bg: #30862d;
    --brand-header-fg: #ffffff;
    --brand-footer-bg: #12361a;
    --brand-footer-fg: #ffffff;
    --brand-border: #dddddd;
    --brand-ring: #30862d;
    --brand-heading-font: 'Roboto', sans-serif;
    --brand-body-font: 'Roboto', sans-serif;
    --brand-radius: 0.25rem;
    --brand-button-radius: 0.25rem;
    --brand-card-radius: 0px;
  }

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Header and filled Sign In button computed as rgb(48, 134, 45) / #30862d with white text."
    - "Hero CTA OUR WELLNESS APPROACH is a white pill (border-radius 9999px) with #30862d text and a 1px #30862d border. Header SIGN IN is white with 4px radius."
    - "Default token radius is 4px because utility buttons measure 4px. Marketing .btn variants in this starter are already pills."
    - "Headings and body compute to Roboto. Typekit also loads century-gothic and mr-eaves-modern, but those faces are not the computed heading or body font."
    - "Footer fill is a forest photograph, not a flat color. --color-dark #12361a is the dark green used when a component asks for a dark surface."
    - "Testimonial band computes to rgb(240, 240, 240). Page background is white. Body text computes to black; foreground token is #111111."
    - "Accent #21833b is the second Brandfetch brand green, used for highlights that are not the primary button."
    - "Brand lime #eefe9c is recorded as an extra color. It is not used as a text color because it fails contrast on white."
    - "Secondary #eef5ee is an 8% tint of primary on white so light buttons and surfaces stay green-tinted."
