# Client Brand Theme — DF Supply
# Wired into the app via the create-new-theme skill (data-theme="dfsupply").
# Token CSS: src/assets/styles/themes/dfsupply.css

client:
  name: "DF Supply"
  sourceUrl: "https://dfsupply.com/"
  extractedAt: "2026-08-19"
  extractedBy: "cursor"

colors:
  primary: "#D4A017"
  primaryForeground: "#ffffff"
  secondary: "#F5F5F5"
  secondaryForeground: "#333333"
  accent: "#2D3E4E"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#333333"
  muted: "#F5F5F5"
  mutedForeground: "#6B7280"
  headerBackground: "#ffffff"
  headerForeground: "#333333"
  footerBackground: "#2D3E4E"
  footerForeground: "#ffffff"
  border: "#D4D4D4"
  ring: "#D4A017"
  extra:
    - name: "primary-hover"
      value: "#B88914"
    - name: "dark-hover"
      value: "#243240"
    - name: "cta-band"
      value: "#5A6978"
    - name: "section-heading"
      value: "#D4A017"
    - name: "border-radius"
      value: "0"

typography:
  headingFamily: "Roboto"
  headingWeight: "700"
  bodyFamily: "Open Sans"
  bodyWeight: "400"
  googleFontsUrl: "https://fonts.googleapis.com/css?family=Open+Sans:400,700%7CRoboto:400,700"
  headingTransform: "uppercase"
  letterSpacing: "0.04em"

shape:
  borderRadius: "0"
  buttonRadius: "0"
  cardRadius: "0"
  shadowStyle: "subtle"
  borderStyle: "subtle"

tone:
  overall: "corporate-industrial"
  colorMode: "light"
  contrast: "medium-high"
  imagery: "photography"
  heroStyle: "full-bleed-image-with-overlay-text"
  cardStyle: "flat-bordered"
  navStyle: "minimal-solid-bar"

extraction:
  confidence: "medium"
  method: "playwright-partial + user-screenshot"
  notes:
    - "Playwright meta fetch returned 403; colors/fonts confirmed from user screenshot and Google Fonts link."
    - "Mustard gold #D4A017 used for section headings, hero accent word, and CONTACT US CTAs."
    - "Dark slate navy #2D3E4E for footer, icon circles, and dark chrome."
    - "Alternating white / light-gray (#F5F5F5) section backgrounds; medium slate CTA band ~#5A6978."
    - "Roboto for headings (uppercase, letter-spaced); Open Sans for body — both via existing next/font loads."
    - "Square CTAs and minimal border-radius throughout."
