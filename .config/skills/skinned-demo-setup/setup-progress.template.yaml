# Skinned Demo Setup — Progress Tracker
# Created after inputs are collected. Updated after each step.
# Used by "resume skinned demo setup" to skip completed work.
# Do NOT store secrets (tokens, client secrets, passwords) in this file.

customer:
  name: ""
  systemName: ""            # <customer-system-name>
  folder: ""                # <customer-folder> kebab-case
  url: ""
  screenshotPath: ""        # path or attachment note — not binary
  startedAt: ""
  lastUpdatedAt: ""

selection:
  collectionMode: ""        # new | existing
  customerCollection: ""
  collectionId: ""
  sourceSiteName: ""
  sourceSiteId: ""
  sourceCollectionId: ""
  sourceFolder: ""
  needsMove: null           # true | false

